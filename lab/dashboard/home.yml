# Riven Lab — Home screen copy. build.py turns this into dist/home.json; edit freely and rebuild.
# Tone (DESIGN.md): short sentences, plain words, no exclamation marks, no emojis. Explain a term the first time it appears.

hero:
  title: "Riven Lab"
  subtitle: "A testing ground for the Riven, The Exile deck."
  lede: "The lab plays thousands of simulated Riftbound games between deck lists and reports which changes hold up against the tournament field."

# "What's next": three steps, in order. Keep each text to one or two sentences.
next:
  - title: "A stronger bot"
    text: "Keep the self-play ladder running until the bot clearly beats a random player and starts agreeing with strong human players more often. Deck results only mean something once the bot plays sensibly."
  - title: "The flexible slots, settled"
    text: "Rerun the one-for-one swaps of the Sacramento list with enough games per matchup to separate the candidates, then promote the winners into a new reference list."
  - title: "More human games"
    text: "Replay more RiftLite games through the engine so the agreement figure rests on hundreds of compared decisions rather than a handful."

# Status page (Home). Hand-kept history of the measurements that are not in data.json; newest last.
status:
  engine:            # median engine-side desyncs per replayed RiftLite game (random agent); the live value comes from data.json
    target: 3
    history: [{label: "start", value: 17}, {label: "pass 2", value: 9}, {label: "pass 3", value: 6.5}, {label: "pass 4", value: 5.0}]
  agreement:         # bot's first choice = the human's move, clean decisions only
    target: 40
    history: [{label: "net 22", value: 41}, {label: "net 27", value: 34}, {label: "net 32", value: 36}, {label: "net 38", value: 38.3}]
  settle:            # search plays combats out before judging a position
    rate: 0.597
    ci: [0.575, 0.618]
    games: 2000
    state: "confirmed, on"
  decks:
    state: "on hold"
  meta:              # recent events whose top lists are not imported yet (found on riftdecks.com, 31 Oct)
    missing: ["SCG CON Hartford $10K", "Le Rift Tour Finale, Paris Games Week", "401 Games Vaughan 5k", "CoolStuffCon Orlando $5k"]
