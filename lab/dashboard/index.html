<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riven Lab</title>
<meta name="description" content="Riven Lab — a testing ground for the Riven, The Exile deck: simulated matches, deck variants, bot replays and human-game comparisons.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="board.css">
<link rel="modulepreload" href="app/main.js">
<link rel="modulepreload" href="app/lib.js">
<link rel="preload" href="data.json" as="fetch" crossorigin="anonymous">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 28 9v14l-12 7-12-7V9z' fill='%230a0e1a' stroke='%23d6b25e' stroke-width='1.5'/%3E%3Cpath d='M16 7l6 9-6 9-6-9z' fill='%23d6b25e'/%3E%3C/svg%3E">
</head>
<body data-view="">
<!-- Shell only: header, primary navigation, the view container, the global card-preview layer and the footer.
     Every screen is a module in app/<view>.js, mounted by app/main.js (hash router). See DESIGN.md. -->
<header class="top"><div class="wrap">
  <a class="brand" href="#/home" aria-label="Riven Lab, home">
    <svg class="sig" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 9v14l-12 7-12-7V9z" fill="none" stroke="var(--gold)" stroke-width="1.5"/><path d="M16 7l6 9-6 9-6-9z" fill="var(--gold)"/><path d="M16 11l3 5-3 5-3-5z" fill="#0a0e1a"/></svg>
    <span>Riven Lab</span>
  </a>
  <nav class="primary" aria-label="Sections">
    <a href="#/home" data-view="home">Home</a>
    <a href="#/tests" data-view="tests">Tests</a>
    <a href="#/decks" data-view="decks">Decks</a>
    <a href="#/replays" data-view="replays">Replays</a>
    <a href="#/play" data-view="play">Play</a>
    <a href="#/bot" data-view="bot">Bot</a>
    <a href="#/cards" data-view="cards">Cards</a>
    <a href="#/launch" data-view="launch">Launch</a>
  </nav>
</div></header>

<main id="view" class="wrap" aria-live="polite"><div class="loading"><span class="spinner"></span>Loading the lab data…</div></main>

<div id="card-backdrop" class="card-backdrop"></div>
<div id="card-preview" class="card-preview" aria-hidden="true"></div>

<footer class="foot"><div class="wrap">
  <span>Riven Lab · simulated Riftbound matches for the Riven, The Exile deck</span>
  <span class="mono" id="foot-meta"></span>
</div></footer>

<script src="board.js"></script>
<script type="module" src="app/main.js"></script>
</body>
</html>
