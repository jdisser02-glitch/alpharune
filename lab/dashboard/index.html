<meta charset="utf-8">
<title>Riven Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden]{display:none !important}
select,input,textarea{max-width:100%;min-width:0}
/* Layout: a lab console — sticky tab bar, one working view at a time, data in tables and hand-drawn SVG charts. */
:root {
  --bg: #f4f3f8; --panel: #ffffff; --sunk: #ebe9f3; --line: #d9d5e6; --fg: #1d1a2b; --muted: #645f7a;
  --chaos: #6b46e0; --calm: #138a6e; --win: #1f8a4c; --loss: #c2413b; --warn: #b7791f; --plumb: #8a8799;
  --chaos-soft: #ece6ff; --calm-soft: #dff3ec;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14121d; --panel: #1c1a28; --sunk: #242132; --line: #34304a; --fg: #ebe8f5; --muted: #a29dba;
  --chaos: #9a7dff; --calm: #3cc79f; --win: #46c37b; --loss: #ef6a62; --warn: #e0a53c; --plumb: #7f7b92;
  --chaos-soft: #2b2447; --calm-soft: #173a31; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14121d; --panel: #1c1a28; --sunk: #242132; --line: #34304a; --fg: #ebe8f5; --muted: #a29dba;
  --chaos: #9a7dff; --calm: #3cc79f; --win: #46c37b; --loss: #ef6a62; --warn: #e0a53c; --plumb: #7f7b92;
  --chaos-soft: #2b2447; --calm-soft: #173a31; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 10px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.brand .sig { width: 22px; height: 22px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a { font-family: var(--display); font-weight: 600; text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 14px; letter-spacing: .03em; text-transform: uppercase; }
nav.tabs a:hover { color: var(--fg); background: var(--sunk); }
nav.tabs a[aria-current="page"] { color: var(--fg); background: var(--chaos-soft); box-shadow: inset 0 -2px 0 var(--chaos); }
.meta { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
main { padding-block: 22px 60px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 26px; } h2 { font-size: 19px; } h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
p { margin: 0; max-width: 72ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel > h2 + * { margin-top: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.kpi b { display: block; font: 600 24px var(--display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-block; font: 600 11px var(--mono); padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.plumb { color: var(--plumb); } .pill.bot { color: var(--chaos); } .pill.ok { color: var(--win); } .pill.bad { color: var(--loss); } .pill.warn { color: var(--warn); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 12px var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunk); } tr.sel td { background: var(--chaos-soft); }
.wr { display: flex; align-items: center; gap: 8px; min-width: 190px; }
.wr svg { flex: 0 0 120px; }
.wr b { font: 600 13px var(--mono); min-width: 46px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
button:hover { border-color: var(--chaos); }
button.primary { background: var(--chaos); color: #fff; border-color: var(--chaos); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--chaos); outline-offset: 2px; }
select, input[type=text], input[type=number], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; min-height: 64px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.list { display: flex; flex-direction: column; gap: 2px; }
.cardrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 46px 30px; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 4px; font-size: 14px; }
.cardrow:hover { background: var(--sunk); }
.cost { font: 600 12px var(--mono); text-align: center; border-radius: 4px; padding: 1px 0; background: var(--sunk); }
.dom { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: 1px; }
.board { display: flex; flex-direction: column; gap: 10px; }
.side { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--sunk); }
.side.p1 { border-left: 3px solid var(--calm); } .side.p2 { border-left: 3px solid var(--chaos); }
.side header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; font-size: 13px; }
.side header b { font: 600 15px var(--display); }
.bfs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.bf { border: 1px dashed var(--line); border-radius: 8px; padding: 8px; background: var(--panel); min-width: 0; }
.bf h4 { margin: 0 0 6px; font: 600 13px var(--display); display: flex; justify-content: space-between; gap: 6px; }
.unit { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; margin: 2px; font-size: 12.5px; background: var(--panel); }
.unit.ex { opacity: .6; border-style: dashed; }
.unit .m { font: 600 11px var(--mono); }
.unit.p1 { box-shadow: inset 3px 0 0 var(--calm); } .unit.p2 { box-shadow: inset 3px 0 0 var(--chaos); }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) 110px 46px auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 5px; font-size: 14px; }
.opt.chosen { background: var(--chaos-soft); font-weight: 600; }
.opt .bar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.opt .bar i { display: block; height: 100%; background: var(--chaos); }
.opt.mine { outline: 2px solid var(--calm); }
.log { max-height: 220px; overflow: auto; background: var(--sunk); border-radius: 6px; padding: 8px; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
.notice { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--sunk); border-radius: 0 6px 6px 0; font-size: 14px; }
.notice.ok { border-color: var(--win); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
svg text { fill: var(--muted); font: 11px var(--mono); }
.delta-add { color: var(--win); } .delta-rem { color: var(--loss); }
@media (prefers-reduced-motion: no-preference) { .opt .bar i { transition: width .25s ease; } }
</style>

<header class="top"><div class="wrap">
  <div class="brand"><svg class="sig" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21 L14 10 L17 13 L6 24 Z" fill="var(--calm)"/><path d="M13 3 L21 3 L21 11 L17 15 L9 7 Z" fill="var(--chaos)"/></svg>Riven Lab</div>
  <nav class="tabs" aria-label="Sections">
    <a href="#tests" data-tab="tests">Tests</a>
    <a href="#decks" data-tab="decks">Decks</a>
    <a href="#replays" data-tab="replays">Replays</a>
    <a href="#bot" data-tab="bot">Bot</a>
    <a href="#launch" data-tab="launch">Launch</a>
  </nav>
  <div class="meta" id="meta">loading…</div>
</div></header>

<main class="wrap">
  <section id="v-tests" class="stack"></section>
  <section id="v-decks" class="stack" hidden></section>
  <section id="v-replays" class="stack" hidden></section>
  <section id="v-bot" class="stack" hidden></section>
  <section id="v-launch" class="stack" hidden></section>
</main>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => x == null ? "—" : (100 * x).toFixed(1) + "%";
const DOM = {fury:"#d4483b", calm:"#138a6e", mind:"#3a7bd5", body:"#d9822b", chaos:"#6b46e0", order:"#c9a227"};
let D = null;                      // data.json
let state = { test: null, deck: null, compare: null, replay: null, frame: 0, rep: null };
let db = null, user = null, mcp = null, meId = null;
const annotations = new Map();     // key replay|frame -> doc

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

// ── Small SVG helpers ───────────────────────────────────────────────────────
function wrBar(rate, ci) {
  const w = 120, x = v => Math.max(0, Math.min(w, v * w));
  const color = rate == null ? "var(--plumb)" : rate >= 0.55 ? "var(--win)" : rate <= 0.45 ? "var(--loss)" : "var(--warn)";
  return `<svg width="${w}" height="14" viewBox="0 0 ${w} 14" role="img" aria-label="rate ${pct(rate)}">
    <rect x="0" y="5" width="${w}" height="4" rx="2" fill="var(--sunk)"/>
    <line x1="${w/2}" x2="${w/2}" y1="1" y2="13" stroke="var(--line)"/>
    ${ci ? `<rect x="${x(ci[0])}" y="4" width="${Math.max(1, x(ci[1]) - x(ci[0]))}" height="6" rx="3" fill="${color}" opacity=".3"/>` : ""}
    ${rate == null ? "" : `<circle cx="${x(rate)}" cy="7" r="4" fill="${color}"/>`}</svg>`;
}
function wr(rate, ci) { return `<div class="wr">${wrBar(rate, ci)}<b>${pct(rate)}</b>${ci ? `<span class="muted small">${(100*ci[0]).toFixed(0)}–${(100*ci[1]).toFixed(0)}</span>` : ""}</div>`; }

function curveChart(decks) {
  // decks: [{label, curve:{cost:count}, color}]
  const costs = new Set(); decks.forEach(d => Object.keys(d.curve || {}).forEach(c => costs.add(+c)));
  const xs = [...costs].sort((a, b) => a - b); if (!xs.length) return "";
  const maxN = Math.max(1, ...decks.flatMap(d => Object.values(d.curve || {})));
  const W = 520, H = 180, L = 28, B = 22, T = 10, bw = (W - L - 8) / xs.length, gw = bw * 0.8 / decks.length;
  const y = n => T + (H - T - B) * (1 - n / maxN);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="energy curve">`;
  for (let g = 0; g <= maxN; g += Math.max(1, Math.ceil(maxN / 4))) s += `<line x1="${L}" x2="${W-4}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end">${g}</text>`;
  xs.forEach((c, i) => {
    decks.forEach((d, k) => { const n = (d.curve || {})[c] || 0; const x0 = L + i * bw + bw * 0.1 + k * gw;
      s += `<rect x="${x0}" y="${y(n)}" width="${gw - 2}" height="${H - B - y(n)}" rx="2" fill="${d.color}"><title>${esc(d.label)}: ${n} card(s) at ${c}</title></rect>`;
      if (n) s += `<text x="${x0 + gw/2 - 1}" y="${y(n) - 3}" text-anchor="middle">${n}</text>`; });
    s += `<text x="${L + i * bw + bw/2}" y="${H - 6}" text-anchor="middle">${c}</text>`; });
  return s + `</svg>`;
}

// ── Data access ─────────────────────────────────────────────────────────────
const cardIndex = () => (D._cards ??= new Map(D.cards.map(c => [c.name.toLowerCase(), c])));
const deckByPath = p => D.decks.find(d => d.path === p);
function deckLabel(p) {
  const d = deckByPath(p); if (!d) return p;
  const head = (d.comments || [])[0] || "";
  const m = head.match(/^(\d+) - (.+?) - (.+)$/);
  if (m) return `${m[3]} — ${m[2]} (#${m[1]}, ${p.split("/")[3] || ""})`;
  return p.replace(/^decks\//, "").replace(/^lab\/variants\//, "variant ").replace(/\.txt$/, "");
}
const isPlumbing = t => /^random$/.test(t.agent || "") && /^random$/.test(t.opp_agent || t.agent || "");

// ── Tests view ──────────────────────────────────────────────────────────────
function viewTests() {
  const el = $("#v-tests");
  const tests = D.tests;
  const real = tests.filter(t => !isPlumbing(t));
  const ladder = D.ladder.iterations || [];
  const lastBot = ladder.filter(r => r.accepted).slice(-1)[0];
  let best = null;
  real.forEach(t => t.decks.forEach(d => { if (d.weighted_win_rate != null && (!best || d.weighted_win_rate > best.d.weighted_win_rate)) best = {t, d}; }));
  const nRad = D.cards.filter(c => c.set === "RAD").length;
  el.innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${tests.length}</b><span>recorded tests (${real.length} with a thinking bot)</span></div>
      <div class="kpi"><b>${nRad}</b><span>playable Radiance cards / ${D.cards.length} total</span></div>
      <div class="kpi"><b>${lastBot ? pct(lastBot.vs_random.rate) : "—"}</b><span>current bot vs a random player${lastBot ? ` (iteration ${lastBot.iteration})` : ""}</span></div>
      <div class="kpi"><b>${best ? pct(best.d.weighted_win_rate) : "—"}</b><span>${best ? "best list: " + esc(best.d.label) : "no test with a real bot yet"}</span></div>
    </div>
    <div class="panel"><h2>Tests</h2>
      <p class="small muted">Each test plays every deck against every opponent, half the games on the play, half on the draw. The 95% interval shows how sure the number is: two lists whose intervals overlap are not separated. Tests marked <span class="pill plumb">plumbing</span> use random players: they check that everything runs, and say nothing about a deck's strength.</p>
      <div class="tablewrap"><table><thead><tr><th>Test</th><th>Date</th><th>Players</th><th>Games</th><th>Result per deck (weighted)</th></tr></thead><tbody>
      ${tests.map((t, i) => `<tr class="click ${state.test === i ? "sel" : ""}" data-i="${i}">
        <td><b>${esc(t.name)}</b><div class="small muted">${esc(t.description || "")}</div></td>
        <td class="mono">${esc((t.started_utc || "").replace("T", " ").slice(0, 16))}</td>
        <td>${isPlumbing(t) ? `<span class="pill plumb">plumbing</span>` : `<span class="pill bot">${esc(t.agent)}</span>${t.opp_agent && t.opp_agent !== t.agent ? `<div class="small muted">vs ${esc(t.opp_agent)}</div>` : ""}`}</td>
        <td class="mono">${t.games_per_matchup}/matchup</td>
        <td>${t.decks.map(d => `<div><span class="small">${esc(d.label)}</span>${wr(d.weighted_win_rate, null)}</div>`).join("")}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div id="testDetail"></div>`;
  el.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => { state.test = +tr.dataset.i; store("rl.test", state.test); viewTests(); });
  if (state.test != null && tests[state.test]) renderTestDetail(tests[state.test]);
}

function renderTestDetail(t) {
  const el = $("#testDetail");
  el.innerHTML = `<div class="panel stack"><div><h2>${esc(t.name)}</h2><p class="small muted">${esc(t.description || "")}</p></div>
    <div class="row small"><span class="chip">engine ${esc(t.engine_commit)}</span><span class="chip">seed ${t.seed}</span><span class="chip">${t.games_per_matchup} games per matchup, alternating seats</span><span class="chip">${esc(t.agent)} vs ${esc(t.opp_agent || t.agent)}</span></div>
    ${t.decks.map(d => `<div class="stack"><h3>${esc(d.label)} — ${pct(d.weighted_win_rate)} weighted</h3>
      ${d.errors && d.errors.length ? `<div class="notice">Invalid deck: ${d.errors.map(esc).join("; ")}</div>` : ""}
      <div class="tablewrap"><table><thead><tr><th>Opponent</th><th>Weight</th><th>Wins</th><th>Rate and 95% interval</th><th>On the play / draw</th><th>Time</th><th></th></tr></thead><tbody>
      ${(d.matchups || []).map(m => `<tr><td>${esc(m.opponent)}</td><td class="mono">${m.weight}</td><td class="mono">${m.wins}/${m.games}</td><td>${wr(m.win_rate, m.ci95)}</td>
        <td class="mono">${m.as_p1.wins}/${m.as_p1.games} · ${m.as_p2.wins}/${m.as_p2.games}</td><td class="mono">${m.wall_s} s</td>
        <td>${D.replays.some(r => r.test_id === t.id) ? `<a href="#replays" data-test="${esc(t.id)}" class="small">replays</a>` : ""}</td></tr>`).join("")}
      </tbody></table></div>
      <details><summary class="small muted">Exact commands (to rerun this test)</summary><div class="log">${(d.matchups || []).flatMap(m => m.commands || []).map(esc).join("\n")}</div></details></div>`).join("")}
  </div>`;
  el.querySelectorAll("a[data-test]").forEach(a => a.onclick = () => { state.repFilter = a.dataset.test; });
}

// ── Decks view ──────────────────────────────────────────────────────────────
function groupDecks() {
  const g = { "Riven lists": [], "Variants": [], "Meta (tournaments)": [], "Engine test decks": [] };
  D.decks.forEach(d => {
    if (d.path.startsWith("lab/variants/")) g["Variants"].push(d);
    else if (d.path.startsWith("lab/decks/meta/")) g["Meta (tournaments)"].push(d);
    else if (/riven_/.test(d.path)) g["Riven lists"].push(d);
    else g["Engine test decks"].push(d);
  });
  return g;
}
function deckOptions(sel) {
  return Object.entries(groupDecks()).map(([k, ds]) => `<optgroup label="${esc(k)}">${ds.map(d => `<option value="${esc(d.path)}" ${d.path === sel ? "selected" : ""}>${esc(deckLabel(d.path))}${d.errors && d.errors.length ? " ⚠" : ""}</option>`).join("")}</optgroup>`).join("");
}
function cardList(list) {
  const idx = cardIndex();
  const rows = [];
  for (const sec of ["champion", "maindeck"]) for (const [n, k] of Object.entries(list[sec] || {})) {
    const c = idx.get(n.toLowerCase()) || {}; rows.push({n, k, c, sec});
  }
  rows.sort((a, b) => (a.c.energy ?? 99) - (b.c.energy ?? 99) || a.n.localeCompare(b.n));
  return `<div class="list">${rows.map(r => `<div class="cardrow"><span class="cost">${r.c.energy ?? "?"}</span><span>${(r.c.domains || []).map(d => `<i class="dom" style="background:${DOM[d] || "var(--plumb)"}"></i>`).join("")}${esc(r.n)}${r.sec === "champion" ? ' <span class="pill bot">champion</span>' : ""}</span><span class="small muted">${esc(r.c.type || "")}</span><b class="mono">×${r.k}</b></div>`).join("")}</div>`;
}
function viewDecks() {
  const el = $("#v-decks");
  const sel = state.deck || "decks/riven_sacramento.txt", cmp = state.compare || "";
  const a = deckByPath(sel), b = cmp ? deckByPath(cmp) : null;
  const diff = () => {
    if (!a || !b) return "";
    const ma = {...(a.list.maindeck || {}), ...(a.list.champion || {})}, mb = {...(b.list.maindeck || {}), ...(b.list.champion || {})};
    const names = [...new Set([...Object.keys(ma), ...Object.keys(mb)])].sort();
    const ch = names.map(n => [n, (mb[n] || 0) - (ma[n] || 0)]).filter(([, d]) => d);
    return ch.length ? `<div class="list">${ch.map(([n, d]) => `<div class="small ${d > 0 ? "delta-add" : "delta-rem"}">${d > 0 ? "+" : ""}${d} ${esc(n)}</div>`).join("")}</div>` : `<p class="small muted">Same cards.</p>`;
  };
  el.innerHTML = `
    <div class="panel"><div class="toolbar">

// Variant builder: base deck + changes, validated like lab/riftlab.py.
let draft = store("rl.draft") || null;
function renderBuilder() {
  const el = $("#builder");
  const base = deckByPath(draft?.base || state.deck || "decks/riven_sacramento.txt");
  if (!draft || draft.base !== base.path) draft = { base: base.path, name: "", note: "", changes: {} };
  const idx = cardIndex();
  const legend = idx.get((base.legend || "").toLowerCase()) || D.cards.find(c => c.type === "legend" && (c.tags || []).some(t => (base.legend || "").startsWith(t)));
  const doms = new Set(legend ? legend.domains : []);
  const cur = {...(base.list.maindeck || {})};
  for (const [n, d] of Object.entries(draft.changes)) { cur[n] = (cur[n] || 0) + d; if (cur[n] <= 0) delete cur[n]; }
  const champ = base.list.champion || {};
  const total = Object.values(cur).reduce((a, b) => a + b, 0) + Object.values(champ).reduce((a, b) => a + b, 0);
  const errs = [];
  if (total !== 40) errs.push(`${total} cards instead of 40 (champion included)`);
  for (const [n, k] of Object.entries(cur)) {
    const c = idx.get(n.toLowerCase());
    const all = k + (champ[n] || 0);
    if (!c) errs.push(`${n}: card unknown to the engine`);
    else if (c.domains.length && !c.domains.every(d => doms.has(d))) errs.push(`${n}: outside the legend's domains`);
    if (all > 3) errs.push(`${n}: ${all} copies (3 max)`);
  }
  const curve = {}; for (const [n, k] of [...Object.entries(cur), ...Object.entries(champ)]) { const c = idx.get(n.toLowerCase()); if (c) curve[c.energy] = (curve[c.energy] || 0) + k; }
  const pool = D.cards.filter(c => !["legend", "battlefield", "rune"].includes(c.type) && (!c.domains.length || c.domains.every(d => doms.has(d))) && c.super !== "token").sort((a, b) => a.energy - b.energy || a.name.localeCompare(b.name));
  const spec = { name: draft.name || "my-variant", base: draft.base, note: draft.note, changes: { maindeck: Object.fromEntries(Object.entries(draft.changes).filter(([, d]) => d)) } };
  el.innerHTML = `<h2>Build a variant</h2>
    <p class="small muted">Starts from the list selected above; add or remove cards and the curve and legality update. Then "Test this variant" queues it in the Launch tab.</p>
    <div class="toolbar"><label class="f">Name<input type="text" id="vn" value="${esc(draft.name)}" placeholder="e.g. sacramento-no-heron"></label>
      <label class="f" style="flex:1">Why<input type="text" id="vnote" value="${esc(draft.note)}" placeholder="e.g. 3 Heron replaced by 2 Deserter and 1 Baron"></label></div>
    <div class="grid2">
      <div class="stack"><h3>List (${total}/40)</h3><div class="list">${Object.entries(cur).sort((a, b) => (idx.get(a[0].toLowerCase())?.energy ?? 9) - (idx.get(b[0].toLowerCase())?.energy ?? 9)).map(([n, k]) => {
          const d = draft.changes[n] || 0; const c = idx.get(n.toLowerCase()) || {};
          return `<div class="cardrow"><span class="cost">${c.energy ?? "?"}</span><span>${esc(n)} ${d ? `<b class="${d > 0 ? "delta-add" : "delta-rem"}">${d > 0 ? "+" : ""}${d}</b>` : ""}</span><span><button data-n="${esc(n)}" data-d="-1" aria-label="remove ${esc(n)}">−</button></span><span><button data-n="${esc(n)}" data-d="1" aria-label="add ${esc(n)}">+</button></span></div>`; }).join("")}
        ${Object.entries(draft.changes).filter(([n, d]) => d < 0 && !cur[n]).map(([n, d]) => `<div class="cardrow"><span class="cost">·</span><span class="delta-rem">${esc(n)} ${d}</span><span></span><span><button data-n="${esc(n)}" data-d="1">+</button></span></div>`).join("")}</div>
        <div class="toolbar"><label class="f" style="flex:1">Add a card (legend's domains)<select id="addc"><option value="">—</option>${pool.map(c => `<option value="${esc(c.name)}">${c.energy} · ${esc(c.name)} (${esc(c.type)}${c.set === "RAD" ? ", Radiance" : ""})</option>`).join("")}</select></label><button id="addb">Add</button></div>
      </div>
      <div class="stack"><h3>Curve: base vs variant</h3>${curveChart([{label: "base", curve: base.stats.curve, color: "var(--calm)"}, {label: "variant", curve, color: "var(--chaos)"}])}
        ${errs.length ? `<div class="notice">${errs.map(esc).join("<br>")}</div>` : `<div class="notice ok">Legal list.</div>`}
        <div class="toolbar"><button class="primary" id="vtest" ${errs.length || !draft.name ? "disabled" : ""}>Test this variant</button><button id="vreset">Reset to base</button></div>
        <details><summary class="small muted">Spec (lab/specs format)</summary><div class="log">${esc(JSON.stringify(spec, null, 1))}</div></details></div>
    </div>`;
  const save = () => store("rl.draft", draft);
  el.querySelectorAll("button[data-n]").forEach(b => b.onclick = () => { const n = b.dataset.n; draft.changes[n] = (draft.changes[n] || 0) + +b.dataset.d; if (!draft.changes[n]) delete draft.changes[n]; save(); renderBuilder(); });
  $("#addb").onclick = () => { const n = $("#addc").value; if (!n) return; draft.changes[n] = (draft.changes[n] || 0) + 1; save(); renderBuilder(); };
  $("#vn").onchange = e => { draft.name = e.target.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-"); save(); renderBuilder(); };
  $("#vnote").onchange = e => { draft.note = e.target.value; save(); };
  $("#vreset").onclick = () => { draft = null; store("rl.draft", null); renderBuilder(); };
  $("#vtest").onclick = () => { launchDraft.variants.push(spec); location.hash = "#launch"; };
}

async function loadReplay(file) {
  state.replay = file; state.frame = 0; state.rep = null; viewReplays();
  try { const r = await fetch(file); state.rep = await r.json(); } catch (e) { state.rep = { error: String(e) }; }
  // jump to the first decision of player 1 that offered a choice
  const fr = (state.rep.frames || []); const k = fr.findIndex(f => f.options && f.options.length > 1); state.frame = Math.max(0, k);
  viewReplays();
}

  const r = $("#rsel"); if (r) r.onchange = e => e.target.value && loadReplay(e.target.value);

async function saveAnnotation(f, would) {

  const doc = { replay: state.replay, frame: f.n, turn: f.board.turn, player: f.player, options: f.options, bot_choice: f.chosen,
                would_play: would, comment, author: meId || "", at: new Date().toISOString() };
  try { await db.collection("annotations").doc(id).set(doc); annotations.set(state.replay + "|" + f.n, doc); viewReplays(); }
  catch (e) { alert && 0; const n = document.createElement("div"); n.className = "notice"; n.textContent = "Annotation not saved: " + (e.message || e.code); $("#v-replays").prepend(n); }
}

// ── Bot view ────────────────────────────────────────────────────────────────
function viewBot() {
  const el = $("#v-bot");
  const it = D.ladder.iterations || [];
  const chart = () => {
    if (!it.length) return "";
    const W = 560, H = 190, L = 34, B = 24, T = 10, n = it.length;
    const x = i => L + (n === 1 ? (W - L) / 2 : i * (W - L - 12) / (n - 1));
    const y = v => T + (H - T - B) * (1 - v);
    const line = (key, color) => it.map((r, i) => `${i ? "L" : "M"}${x(i)},${y(key(r) ?? 0.5)}`).join(" ");
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="bot progress">`;
    [0, .25, .5, .75, 1].forEach(v => s += `<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`);
    s += `<path d="${line(r => r.vs_random && r.vs_random.rate)}" fill="none" stroke="var(--calm)" stroke-width="2"/>`;
    s += `<path d="${line(r => r.val_acc)}" fill="none" stroke="var(--chaos)" stroke-width="2" stroke-dasharray="4 3"/>`;
    it.forEach((r, i) => { s += `<circle cx="${x(i)}" cy="${y(r.vs_random ? r.vs_random.rate : .5)}" r="4" fill="${r.accepted ? "var(--calm)" : "var(--panel)"}" stroke="var(--calm)" stroke-width="2"/><text x="${x(i)}" y="${H-6}" text-anchor="middle">${r.iteration}</text>`; });
    return s + `</svg><p class="small"><i class="dom" style="background:var(--calm)"></i>win rate vs a random player (filled dot = adopted version) &nbsp; <i class="dom" style="background:var(--chaos)"></i>network accuracy at predicting the winner</p>`;
  };
  el.innerHTML = `<div class="grid2">
    <div class="panel stack"><h2>How the bot plays</h2>
      <p>At each decision, the bot plays out hundreds of possible continuations before choosing (ISMCTS search). It cannot see your hand or the deck order: on each simulation it randomly redeals what it cannot know, from the cards that are still possible.</p>
      <p>To judge a position without playing the game to the end, it uses a small neural network that estimates "who wins from here". The network learns by watching the bot play itself: each iteration produces games, the network trains on them, and the new version is only adopted if it beats the old one.</p>
      <p class="small muted">Early versions are weak: the curve on the right should rise over the iterations. Until the bot clearly beats a random player, deck test results are only indicative.</p></div>
    <div class="panel stack"><h2>Progress</h2>${it.length ? chart() : `<div class="empty">Training has not produced an iteration yet.</div>`}</div></div>
    <div class="panel"><h2>Iterations</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>Training games</th><th>Positions</th><th>Accuracy</th><th>Vs random</th><th>Vs current version</th><th>Adopted</th><th>Time</th></tr></thead><tbody>
    ${it.map(r => `<tr><td class="mono">${r.iteration}</td><td class="small">${r.self_play_games} × ${esc(r.player)}</td><td class="mono">${r.records}</td><td class="mono">${pct(r.val_acc)}</td><td>${r.vs_random ? wr(r.vs_random.rate, null) : "—"}</td><td>${r.vs_current ? wr(r.vs_current.rate, r.vs_current.ci95) : "—"}</td><td>${r.accepted ? `<span class="pill ok">yes</span>` : `<span class="pill bad">no</span>`}</td><td class="mono">${r.minutes} min</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

// ── Launch view ─────────────────────────────────────────────────────────────
const launchDraft = store("rl.launch") || { name: "", decks: ["decks/riven_sacramento.txt"], variants: [], opponents: [], agent: "standard", games: 100 };
const PRESETS = {
  plumbing: { label: "Quick check (random players, a few seconds)", agent: "random" },
  standard: { label: "Standard bot (≈ 30 s per game per thread)", agent: "ismcts:sims=30,eval=net:@current" },
  strong:   { label: "Strong bot (≈ 2 min per game per thread)", agent: "ismcts:sims=100,eval=net:@current" },
};
function metaGauntlet() {
  // Weights: matches against Riven per opponent in the RiftDecks matrix (study, 26 Oct).
  const want = { kennen: 119, "kai_sa": 86, akali: 55, rengar: 41, lillia: 39, leblanc: 35, ekko: 26, viktor: 20, ornn: 15, riven: 100 };
  const out = [], seen = new Set();
  D.decks.filter(d => d.path.startsWith("lab/decks/meta/") && !(d.errors || []).length).forEach(d => {
    const k = Object.keys(want).find(k => d.path.includes("_" + k)); if (!k || seen.has(k)) return; seen.add(k);
    out.push({ deck: d.path, label: deckLabel(d.path).split(" (")[0], weight: want[k] });
  });
  return out;
}
let lastRequest = null;
function buildSpec() {
  const agent = PRESETS[launchDraft.agent].agent.replace("@current", (D.ladder.current_net || "lab/learn/nets/net_000.rbvn"));
  const name = (launchDraft.name || "test").toLowerCase().replace(/[^a-z0-9-]+/g, "-");
  return { name, description: launchDraft.description || "", agent, games: +launchDraft.games, seed: Math.floor(Math.random() * 1e6), review_games: 1,
    decks: [...launchDraft.decks, ...launchDraft.variants.map(v => ({ ...v }))],
    opponents: launchDraft.opponents.length ? launchDraft.opponents : metaGauntlet() };
}
function estimate(spec) {
  const pairs = spec.decks.length * spec.opponents.length, games = pairs * spec.games;
  const per = /random/.test(spec.agent) ? 0.005 : /sims=100/.test(spec.agent) ? 120 : 30;
  const mins = games * per / 4 / 60;
  return `${games} games (${pairs} matchups) — about ${mins < 1 ? "under a minute" : mins < 90 ? Math.round(mins) + " min" : (mins / 60).toFixed(1) + " h"} on 4 cores`;
}
function viewLaunch() {

      <div class="toolbar"><label class="f" style="flex:1">Test name<input type="text" id="ln" value="${esc(launchDraft.name)}" placeholder="e.g. heron-or-deserter"></label></div>

      <h3>Opponents ${launchDraft.opponents.length ? "" : "(default meta gauntlet, weighted by frequency)"}</h3>
      <div class="list">${gauntlet.map((o, i) => `<div class="cardrow" style="grid-template-columns:minmax(0,1fr) 70px auto"><span>${esc(o.label)}</span><input type="number" min="0" value="${o.weight}" data-w="${i}" aria-label="weight"><button data-rmo="${i}">remove</button></div>`).join("")}</div>
      <div class="toolbar"><select id="lao" style="flex:1"><option value="">add an opponent…</option>${deckOptions("")}</select></div>
      <div class="toolbar"><label class="f" style="flex:1">Play strength<select id="lag">${Object.entries(PRESETS).map(([k, p]) => `<option value="${k}" ${k === launchDraft.agent ? "selected" : ""}>${esc(p.label)}</option>`).join("")}</select></label>
        <label class="f">Games per matchup<input type="number" id="lgames" min="2" step="2" value="${launchDraft.games}"></label></div>
      <p class="small muted">${esc(estimate(spec))}. 100 games per matchup give an interval of about ±10 points, 400 games about ±5.</p>
    </div>
    <div class="panel stack"><h2>Send</h2>
      <p class="small">"Send to Claude" passes this test to the lab's working session: Claude runs it (here or on GitHub), then updates this dashboard with the result. If that session is closed, a new Claude Code session is opened to do it.</p>
      <div class="toolbar"><button class="primary" id="lsend" ${spec.decks.length && spec.opponents.length && launchDraft.name ? "" : "disabled"}>Send to Claude</button><button id="lcopy">Copy request</button></div>
      <div id="lstatus"></div>
      <details open><summary class="small muted">Request (lab/specs format)</summary><div class="log" id="lspec">${esc(JSON.stringify(spec, null, 1))}</div></details>
      <div id="lhist"></div>
    </div></div>`;
  const rerender = () => viewLaunch();
  $("#ln").onchange = e => { launchDraft.name = e.target.value; rerender(); };
  $("#ld").onchange = e => { launchDraft.description = e.target.value; rerender(); };
  $("#lad").onchange = e => { if (e.target.value) { launchDraft.decks.push(e.target.value); rerender(); } };
  $("#lao").onchange = e => { if (e.target.value) { if (!launchDraft.opponents.length) launchDraft.opponents = metaGauntlet(); launchDraft.opponents.push({ deck: e.target.value, label: deckLabel(e.target.value), weight: 50 }); rerender(); } };
  el.querySelectorAll("[data-rmd]").forEach(b => b.onclick = () => { launchDraft.decks.splice(+b.dataset.rmd, 1); rerender(); });
  el.querySelectorAll("[data-rmv]").forEach(b => b.onclick = () => { launchDraft.variants.splice(+b.dataset.rmv, 1); rerender(); });
  el.querySelectorAll("[data-rmo]").forEach(b => b.onclick = () => { if (!launchDraft.opponents.length) launchDraft.opponents = metaGauntlet(); launchDraft.opponents.splice(+b.dataset.rmo, 1); rerender(); });
  el.querySelectorAll("[data-w]").forEach(i => i.onchange = () => { if (!launchDraft.opponents.length) launchDraft.opponents = metaGauntlet(); launchDraft.opponents[+i.dataset.w].weight = +i.value; rerender(); });
  $("#lag").onchange = e => { launchDraft.agent = e.target.value; rerender(); };
  $("#lgames").onchange = e => { launchDraft.games = Math.max(2, +e.target.value || 2); rerender(); };
  $("#lcopy").onclick = async () => { const t = JSON.stringify(buildSpec(), null, 1); try { await navigator.clipboard.writeText(t); status("Request copied: paste it into a conversation with Claude.", true); } catch (e) { const r = document.createRange(); r.selectNodeContents($("#lspec")); getSelection().removeAllRanges(); getSelection().addRange(r); status("Selected: copy it with Ctrl+C.", true); } };
  $("#lsend").onclick = () => sendRequest(buildSpec());
  renderHistory();
}
function status(msg, ok) { const s = $("#lstatus"); if (s) s.innerHTML = `<div class="notice ${ok ? "ok" : ""}">${esc(msg)}</div>`; }
async function sendRequest(spec) {
  const btn = $("#lsend"); btn.disabled = true;
  const message = `[Request from the Riven Lab dashboard]\nRun this test with lab/riftlab.py (or by dropping it into lab/requests/ for GitHub Actions), then rebuild and republish the dashboard with the result.\n\n${JSON.stringify(spec, null, 1)}`;
  let how = "";
  if (!mcp) { status("Cannot send from this view: copy the request and paste it to Claude.", false); btn.disabled = false; return; }
  try {
    await mcp.callTool("Claude Code Remote", "send_message", { session_id: D.session_id, message });
    how = "sent to the lab session";
  } catch (e) {
    try {
      await mcp.callTool("Claude Code Remote", "create_session", { environment_id: D.environment_id, source_url: "https://github.com/" + D.repo, source_revision: D.branch, title: "Riven Lab: " + spec.name, prompt: message + `\n\nWork on branch ${D.branch} of repo ${D.repo}; read lab/README.md first.` });
      how = "new Claude Code session opened";
    } catch (e2) {
      const code = e2.code || e.code;
      status(code === "not_in_manifest" || code === "not_granted" ? "The Claude Code connector is not allowed for this page: allow it in the Permissions menu, or copy the request." : code === "server_not_connected" ? "The Claude Code Remote connector is not available here: copy the request and paste it to Claude." : "Send failed (" + (e2.message || code) + "): copy the request and paste it to Claude.", false);
      btn.disabled = false; return;
    }
  }
  if (db) { try { await db.collection("requests").add({ spec, sent: how, at: new Date().toISOString(), author: meId || "" }); } catch (e) {} }
  status("Request sent (" + how + "). The result will show up in the Tests tab once Claude has republished the page.", true);
  btn.disabled = false; renderHistory();
}
async function renderHistory() {
  const h = $("#lhist"); if (!h || !db) return;
  try { const snap = await db.collection("requests").orderBy("at", "desc").limit(10).get();
    h.innerHTML = snap.empty ? "" : `<h3>Sent requests</h3><div class="list">${snap.docs.map(d => { const v = d.data(); return `<div class="small"><span class="mono">${esc((v.at || "").slice(0, 16).replace("T", " "))}</span> — <b>${esc(v.spec && v.spec.name)}</b> <span class="muted">${esc(v.sent || "")}</span></div>`; }).join("")}</div>`;
  } catch (e) { h.innerHTML = ""; }
}

// ── Router and boot ─────────────────────────────────────────────────────────
const VIEWS = { tests: viewTests, decks: viewDecks, replays: viewReplays, bot: viewBot, launch: viewLaunch };
function route() {
  const tab = (location.hash || "#tests").slice(1); const t = VIEWS[tab] ? tab : "tests";
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === t ? "page" : "false"));
  Object.keys(VIEWS).forEach(k => $("#v-" + k).hidden = k !== t);
  if (D) VIEWS[t]();
}
window.addEventListener("hashchange", route);
(async function boot() {
  try { D = await (await fetch("data.json")).json(); }
  catch (e) { $("#v-tests").innerHTML = `<div class="notice">Could not load the lab data (${esc(String(e))}).</div>`; return; }
  $("#meta").textContent = `engine ${D.engine_commit} · data from ${D.generated_utc.replace("T", " ").slice(0, 16)} UTC`;
  const t = store("rl.test"); if (t != null && D.tests[t]) state.test = t;
  route();
  const c = window.claude;
  if (c && c.use) {
    c.use("db").then(async x => { db = x; if (!db) return;
      try { const snap = await db.collection("annotations").get(); snap.docs.forEach(d => { const v = d.data(); annotations.set(v.replay + "|" + v.frame, v); }); } catch (e) {}
      if (!$("#v-replays").hidden || !$("#v-launch").hidden) route(); });
    c.use("user").then(async u => { user = u; if (u) { try { meId = await u.id(); } catch (e) {} } });
    c.use("mcp").then(m => { mcp = m; });
  }
})();
</script>
