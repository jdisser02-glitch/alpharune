# Runs simulation requests for the Riven test lab.
#
# To launch a test, commit a test spec (same format as lab/specs/*.json, see
# lab/README.md), a list-search spec (lab/specs/optimize/*.json, detected by
# its "rounds" key) or a genetic list search (lab/specs/ga/*.json, detected by
# its "population" key) to lab/requests/ on this branch. This workflow builds the
# engine, runs every request added by the push, writes the results to
# lab/results/, moves the request to lab/requests/done/ and pushes both.
#
# Bot training runs here too (the "train" job), dispatched with request=lab/specs/train.json: see that job below.
name: riftlab

on:
  push:
    paths:
      - "lab/requests/*.json"
  workflow_dispatch:
    inputs:
      request:
        description: "Path of a test spec to run (e.g. lab/specs/smoke_random.json), or lab/specs/train.json for training"
        required: true
      chain:
        description: "Training only: jobs to chain after this one (0 = this job only)"
        default: "0"
      minutes:
        description: "Training only: time budget of the loop, in minutes"
        default: "300"

permissions:
  contents: write
  actions: write

jobs:
  run:
    if: github.event_name != 'workflow_dispatch' || !endsWith(github.event.inputs.request, 'train.json')
    concurrency:
      group: riftlab-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ libboost-all-dev nlohmann-json3-dev ccache

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            build/_deps
          key: riftlab-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: riftlab-${{ runner.os }}-

      - name: Build engine
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER="env;CCACHE_SLOPPINESS=pch_defines,time_macros;ccache"
          cmake --build build --target riftbound riftbound_tests -j4
          RIFTBOUND_ROOT=. ./build/riftbound_tests --gtest_brief=1

      - name: Run requests
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requests="${{ github.event.inputs.request }}"
          else
            requests=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'lab/requests/*.json' || true)
          fi
          echo "requests: $requests"
          mkdir -p lab/requests/done
          for r in $requests; do
            [ -f "$r" ] || continue
            if grep -q '"population"' "$r"; then
              python3 lab/ga.py "$r" | tee -a lab/.run.log           # genetic list search spec
            elif grep -q '"kind": *"card_impact"' "$r"; then
              python3 lab/card_impact.py "$r" | tee -a lab/.run.log      # improvement-when-drawn of each card
            elif grep -q '"rounds"' "$r"; then
              python3 lab/optimize.py "$r" | tee -a lab/.run.log     # list search spec
            else
              python3 lab/riftlab.py run "$r" --threads 4 | tee -a lab/.run.log
            fi
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              git mv "$r" lab/requests/done/
            fi
          done

      - name: Keep results as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftlab-results-${{ github.run_id }}
          path: |
            lab/results/*.json
            lab/replays/**/*.json
            lab/.run.log
          if-no-files-found: ignore

      - name: Push results
        if: always()
        run: |
          git config user.name "riftlab-bot"
          git config user.email "riftlab-bot@users.noreply.github.com"
          # Only the run's own outputs: generated files such as lab/index.json
          # are rebuilt by build.py and would conflict with the session's commits.
          # (lab/replays is git-ignored: the review replays travel in the artifact above.)
          for d in lab/results lab/requests lab/variants; do
            if [ -d "$d" ]; then git add -A "$d"; fi
          done
          git commit -m "riftlab: results for ${{ github.sha }}" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

  # Self-play training of the bot (lab/learn/loop.py) within a time budget: the replay buffer is carried between jobs in
  # the Actions cache; the ladder and the adopted nets are committed (a rejected net is not kept in the tree); with
  # chain > 0 the job dispatches the next one.
  train:
    if: github.event_name == 'workflow_dispatch' && endsWith(github.event.inputs.request, 'train.json')
    concurrency:
      group: train-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ libboost-all-dev nlohmann-json3-dev ccache
          python3 -m pip install --quiet numpy

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            build/_deps
          key: riftlab-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: riftlab-${{ runner.os }}-

      - name: Build engine
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER="env;CCACHE_SLOPPINESS=pch_defines,time_macros;ccache"
          cmake --build build --target riftbound -j4

      - name: Restore the replay buffer
        uses: actions/cache/restore@v4
        with:
          path: data/learn
          key: learn-buffer-${{ github.run_id }}
          restore-keys: learn-buffer-

      - name: Train
        id: train
        run: |
          mkdir -p data/learn
          ls -la data/learn || true
          RIFTBOUND_ROOT=. python3 -u lab/learn/loop.py --iterations 20 --games 200 --sims 50 --agent pmcts --settle 60 \
            --policy --human lab/learn/human.rbv3 --threads 4 --accept 0.5 --gate-min 80 --gate-max 240 \
            --max-minutes "${{ github.event.inputs.minutes || '300' }}" 2>&1 | tee train.log
          # keep only the last 6 iterations' data in the buffer
          ls data/learn/iter_*.rbvd 2>/dev/null | sort | head -n -6 | xargs -r rm -f

      - name: Save the replay buffer
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/learn
          key: learn-buffer-${{ github.run_id }}

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-log-${{ github.run_id }}
          path: train.log
          if-no-files-found: ignore

      - name: Commit the ladder and the adopted nets
        if: always()
        run: |
          git config user.name "riftlab-bot"
          git config user.email "riftlab-bot@users.noreply.github.com"
          # a net the gate rejected is not kept in the tree (its ladder row is)
          python3 - <<'PY'
          import glob, json, os, subprocess
          L = json.load(open("lab/learn/ladder.json"))
          keep = {os.path.basename(r["net"]).split(".")[0] for r in L["iterations"] if r.get("accepted") and r.get("net")}
          keep |= {os.path.basename(L[k]).split(".")[0] for k in ("current_net", "reference_net") if L.get(k)}
          for f in glob.glob("lab/learn/nets/net_*"):
              tracked = subprocess.run(["git", "ls-files", "--error-unmatch", f], capture_output=True).returncode == 0
              if not tracked and os.path.basename(f).split(".")[0] not in keep:
                  os.remove(f)
          PY
          git add lab/learn/ladder.json lab/learn/nets
          last=$(python3 -c "import json; r=json.load(open('lab/learn/ladder.json'))['iterations'][-1]; print(r['iteration'], 'accepted' if r.get('accepted') else 'rejected', r.get('vs_current', {}).get('rate'))")
          git commit -m "train: iterations up to ${last} (Actions run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Chain the next job
        if: success() && github.event.inputs.chain != '0' && github.event.inputs.chain != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( ${{ github.event.inputs.chain }} - 1 ))
          gh workflow run riftlab.yml --ref "${GITHUB_REF_NAME}" -f request=lab/specs/train.json -f chain="${left}" -f minutes="${{ github.event.inputs.minutes || '300' }}"
